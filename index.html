      <button onclick="shareObj('${p.name.replace(/[\\']/g,'')}');event.preventDefault()">🔗 ссылка</button>
    </div>`;
}
window.copyCoords = function(lat, lon) {
  const txt = lat + ', ' + lon;

};
window.shareObj = function(name) {
  const p = POI.find(x => x.name === name); if (!p) return;
  const url = SITE_URL + '#obj=' + encodeURIComponent(p.name);
  if (navigator.share) navigator.share({ title:'Оконешниково: ' + p.name, url }).catch(()=>{});

};

let userPos = null;
function renderPOI(q = '') {
  let items = POI.filter(p => (curChip === 'all' || chipFor(p) === curChip)
    && (!q || (p.name + ' ' + p.cat).toLowerCase().includes(q.toLowerCase())));
  if (userPos) items = items.slice().sort((a, b) =>
    map.distance(L.latLng(userPos), L.latLng(a.pos)) - map.distance(L.latLng(userPos), L.latLng(b.pos)));
  poiList.innerHTML = '';
  items.forEach(p => {
    const d = document.createElement('div');
    d.className = 'item' + (p.grp === 'main' ? '' : ' secondary');
    let dist = '';
    if (userPos) dist = '<span class="dist">' + fmtM(map.distance(L.latLng(userPos), L.latLng(p.pos))) + '</span>';
    d.innerHTML = `<div class="ico">${p.ico}</div><div class="t">${p.name}<small>${p.cat}</small></div>${dist}`;
    d.onclick = () => { map.flyTo(p.pos, window.innerWidth<720?17:16, { duration:.8 }); setTimeout(() => p._marker.openPopup(), 850); };
    poiList.appendChild(d);
  });
}

function pathLength(pts) {
  let s = 0;
  for (let i = 1; i < pts.length; i++) s += map.distance(L.latLng(pts[i-1]), L.latLng(pts[i]));
  return s;
}
function renderStreets(q = '') {
  streetList.innerHTML = '';
  const seen = {};
  STREETS_WAYS.filter(s => !q || s[0].toLowerCase().includes(q.toLowerCase())).forEach(s => {
    if (seen[s[0]]) return; seen[s[0]] = true;
    const len = pathLength(s[2]);
    const d = document.createElement('div');
    d.className = 'street';
    d.innerHTML = `<span>${s[0]}</span><small>${fmtM(len)}</small>`;
    d.onclick = () => {
      const lines = streetsByName[s[0]] || [];
      const g = L.featureGroup(lines);
      map.flyToBounds(g.getBounds(), { padding:[100,400], duration:.8, maxZoom:17 });
      lines.forEach(l => flashStreet(l, STYLE_BY_HW[l.options.hwt] || l.options));
    };
    streetList.appendChild(d);
  });
}
renderPOI(); renderStreets();

infoBox.innerHTML = `
  <div class="infobox">
    <div class="row"><div class="e">🏞️</div><div><b>Оконешниково</b> — посёлок городского типа, административный центр <b>Оконешниковского района</b> Омской области (Сибирский федеральный округ).</div></div>
    <div class="row"><div class="e">🧭</div><div>Координаты центра: <b>54.8375° с.ш., 75.0727° в.д.</b> Расположен в юго-восточной части области, недалеко от границы с Казахстаном.</div></div>
    <div class="row"><div class="e">👥</div><div>Население — <b>около 6 тысяч человек</b> (крупнейший населённый пункт района).</div></div>
    <div class="row"><div class="e">📮</div><div>Почтовый индекс: <b>646940</b></div></div>
    <div class="row"><div class="e">🛤️</div><div>Посёлок вырос вокруг железнодорожной станции, которая связывает его областным ж/д ходом с соседними районами.</div></div>
    <div class="row"><div class="e">🏪</div><div>В центре — торговая зона: Пятёрочка, Магнит, Монетка, DNS, МТС, пункты Ozon и Wildberries.</div></div>
    <div class="row"><div class="e">🎗️</div><div>В центре — мемориальный комплекс героям Великой Отечественной войны.</div></div>
    <div class="row"><div class="e">🎲</div><div>Жмяк на 🎲 в шапке — сайт сам покажет случайное место (узнаёшь посёлок изнутри).</div></div>
  </div>`;

// ---------- Игра ----------
const game = { on:false, target:null, score:0, best:+(localStorage.getItem('okn_best')||0), misses:0 };
function renderGame() {
  gameBox.innerHTML = `
    <div class="gamebox" id="gb">
      <div class="score"><span>Счёт: <b>${game.score}</b></span><span>Рекорд: <b>${game.best}</b></span></div>
      <div class="quest" id="quest"></div>
      ${game.on ? '<button class="bigbtn gray" id="giveup">Сдаться и показать ответ</button>'
                : '<button class="bigbtn" id="startGame">▶ Начать игру</button>'}
      <div class="panel-note" style="border-top:none">Кликай по маркеру на карте, где, по-твоему, находится объект. Попадание в радиусе ~60 м = очко!</div>
    </div>`;
  document.getElementById('startGame')?.addEventListener('click', startGame);
  document.getElementById('giveup')?.addEventListener('click', giveUp);
  document.getElementById('quest').innerHTML = game.on
    ? `Найди на карте: <b>${game.target.ico} ${game.target.name}</b>`
    : 'Найди все знаковые места посёлка по памяти ✈️';
}
function startGame() { game.on = true; game.score = 0; game.misses = 0; nextRound(); }
function nextRound() {
  let t;
  do { t = POI[Math.floor(Math.random()*POI.length)]; } while (game.target === t && POI.length > 1);
  game.target = t;
  renderGame();
}
function giveUp() {
  if (!game.target) return;
  map.flyTo(game.target.pos, 16, { duration:.8 });
  setTimeout(() => game.target._marker.openPopup(), 900);
  document.getElementById('quest').innerHTML = `Это был(а) <b>${game.target.ico} ${game.target.name}</b> — ${game.target.cat}`;
  game.target = null; game.on = false;
  setTimeout(renderGame, 2500);
}
function handleTap(p) {
  if (!game.on || p === game.target) { p._marker.openPopup(); return; }
  const d = map.distance(L.latLng(p.pos), L.latLng(game.target.pos));
  const gb = document.getElementById('gb');
  if (d <= 60) {
    game.score++; if (game.score > game.best) { game.best = game.score; localStorage.setItem('okn_best', game.best); }
    if (gb) { gb.classList.add('flash-good'); setTimeout(() => gb.classList.remove('flash-good'), 800); }
    document.getElementById('quest').innerHTML = '🎉 <b>В точку!</b> (+1)';
    game.target._marker.openPopup();
    setTimeout(nextRound, 1200);
  } else {
    game.misses++;
    if (gb) { gb.classList.remove('flash-bad'); void gb.offsetWidth; gb.classList.add('flash-bad'); }
    document.getElementById('quest').innerHTML = `Мимо: это ${p.name} (${fmtM(d)} м от цели). Попробуй ещё!`;
  }
}
function fmtM(m) { return m >= 1000 ? (m/1000).toFixed(1) + ' км' : Math.round(m) + ' м'; }

// ---------- Погода ----------
const WCODE = c => c===0?'☀️':c<3?'🌤️':c===3?'☁️':c<48?'🌫️':c<58?'🌦️':c<68?'🌧️':c<78?'🌨️':c<83?'🌧️':c<88?'🌨️':'⛈️';
(async () => {
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=54.8375&longitude=75.0732&current=temperature_2m,wind_speed_10m,weather_code&timezone=auto');
    const j = await r.json();
    const c = j.current;
    document.getElementById('weatherChip').innerHTML =
      `<span style="font-size:18px">${WCODE(c.weather_code)}</span>
       <span class="t">${Math.round(c.temperature_2m)}°C</span>
       <span class="d">ветер ${Math.round(c.wind_speed_10m)} м/с</span>`;
  } catch (e) { document.getElementById('weatherChip').innerHTML = '<span class="d">погода недоступна</span>'; }
})();

// ---------- Геолокация ----------
let userMarker = null, userCircle = null;
function findUser(beforeFly) {
  if (!navigator.geolocation) { alert('Геолокация не поддерживается'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    userPos = ll;
    if (userMarker) map.removeLayer(userMarker);
    if (userCircle) map.removeLayer(userCircle);
    userMarker = L.marker(ll, { icon: L.divIcon({ className:'', html:'<div class="user-dot"></div>', iconSize:[18,18], iconAnchor:[9,9] }) }).addTo(map);
    userCircle = L.circle(ll, { radius: pos.coords.accuracy || 30, color:'#8b5cff', fillOpacity:.12, weight:1 }).addTo(map);
    map.flyTo(ll, Math.max(15, map.getZoom()), { duration:.8 });
    let nearest = POI[0], nd = 1e15;
    POI.forEach(p => { const d = map.distance(L.latLng(ll), L.latLng(p.pos)); if (d < nd) { nd = d; nearest = p; } });
    userMarker.bindPopup(`<div class="pop-title">📍 Ты здесь</div>
      <div class="pop-cat">точность ±${Math.round(pos.coords.accuracy||30)} м</div>
      <div class="pop-cat">Ближайший объект: ${nearest.ico} ${nearest.name} — ${fmtM(nd)}</div>
      <div class="pop-actions"><a target="_blank" rel="noopener" href="https://yandex.ru/maps/?rtext=~${ll[0]},${ll[1]}~${nearest.pos[0]},${nearest.pos[1]}">🚗 маршрут</a></div>`);
    renderPOI(filterInp.value.trim()); // перерисовать с расстояниями
    beforeFly && beforeFly();
  }, () => alert('Не удалось получить местоположение. Проверь разрешения браузера.'), { enableHighAccuracy:true });
}
document.getElementById('locBtn').onclick = () => findUser();

// Сортировка по расстоянию
const sortBtn = document.createElement('button');
sortBtn.id = 'sortBtn';
sortBtn.textContent = '📏 Показать объекты по расстоянию от меня';
sortBtn.onclick = () => { if (!userPos) findUser(); else { sortBtn.textContent='📏 Уже отсортировано ✓'; setTimeout(()=>sortBtn.textContent='📏 Показать объекты по расстоянию от меня', 1500); } };
filterInp.parentElement.parentElement.insertBefore(sortBtn, filterInp.parentElement.parentElement.querySelector('.chips'));

// ---------- Случайное место ----------
document.getElementById('randBtn').onclick = () => {
  const p = POI[Math.floor(Math.random()*POI.length)];
  map.flyTo(p.pos, 16.5, { duration:1 });
  setTimeout(() => p._marker.openPopup(), 1100);
};

// ---------- Поделиться ----------
document.getElementById('shareBtn').onclick = async () => {
  const data = { title:'Карта пгт Оконешниково', text:'Интерактивная карта посёлка Оконешниково: улицы, дома, достопримечательности', url: location.href };
  if (navigator.share) { try { await navigator.share(data); } catch(e){} }
  else { navigator.clipboard?.writeText(location.href); alert(location.href); }
};

// ---------- Табы ----------
const tabs = { poi:poiList, streets:streetList, game:gameBox, info:infoBox };
document.querySelectorAll('.panel-tabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.panel-tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const t = b.dataset.tab;
    Object.entries(tabs).forEach(([k, el]) => el.style.display = k === t ? '' : 'none');
    chipsEl.style.display = t === 'poi' ? 'flex' : 'none';
    sortBtn.style.display = t === 'poi' ? '' : 'none';
    searchWrap.style.display = (t === 'game' || t === 'info') ? 'none' : '';
    filterInp.value = ''; curChip = 'all';
    chipsEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.chip === 'all'));
    renderPOI(); renderStreets();
    if (t === 'game') renderGame();
  };
});
filterInp.addEventListener('input', () => {
  const q = filterInp.value.trim();
  const active = document.querySelector('.panel-tabs button.active')?.dataset.tab;
  if (active === 'poi') renderPOI(q);
  if (active === 'streets') renderStreets(q);
});

// ---------- PWA ----------
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

// ---------- Раскладка ----------
const toggle = document.getElementById('toggle');
const panel = document.getElementById('panel');
function syncToggle() {
  toggle.style.right = panel.classList.contains('hidden') ? '0px' : panel.offsetWidth + 'px';
  toggle.textContent = panel.classList.contains('hidden') ? '◀' : '▶';
}
toggle.onclick = () => { panel.classList.toggle('hidden'); syncToggle(); };
if (window.innerWidth < 720) panel.classList.add('hidden');
syncToggle();

const wrap = document.querySelector('header').nextElementSibling;
function sizeFix() {
  const h = window.innerHeight - (window.innerWidth < 720 ? 54 : 58);
  if (wrap.clientHeight < 200) { wrap.style.height = h + 'px'; wrap.style.flex = '0 0 auto'; }
  map.invalidateSize();
}
window.addEventListener('resize', sizeFix);
window.addEventListener('load', sizeFix);
sizeFix();
renderGame();

setTimeout(() => { try { if (!linked) map.fitBounds(townPoly.getBounds(), { padding: window.innerWidth < 720 ? [40,40] : [60, 360] }); } catch(e){} }, 400);
</script>
